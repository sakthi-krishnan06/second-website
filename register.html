<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mausam - Create Account</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/128/12607/12607703.png">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial;

            background:
                linear-gradient(
                    135deg,
                    #4facfe,
                    #764ba2
                );
        }

        .card {

            width: 400px;

            padding: 35px;

            background: white;

            border-radius: 20px;

            box-shadow:
                0 20px 50px
                rgba(0,0,0,0.25);

        }

        h1 {

            text-align: center;

            color: #4776e6;

        }

        input {

            width: 100%;

            padding: 14px;

            margin: 10px 0;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 15px;

        }

        button {

            width: 100%;

            padding: 14px;

            margin-top: 15px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #4776e6,
                    #8e54e9
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }

        p {

            text-align: center;

        }

        a {

            color: #4776e6;

        }

    </style>

</head>


<body>

    <div class="card">

        <h1>🌦️ Create Account</h1>

        <p>Create your Mausam account</p>


        <form id="registerForm">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password"
                required
            >

            <button type="submit">
                Create Account
            </button>

        </form>


        <p id="message"></p>


        <p>

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>


    <script src="register.js"></script>

</body>

</html>
