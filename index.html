<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mausam - Login</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/128/12607/12607703.png">

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <!-- Background Weather Decorations -->
    <div class="cloud cloud1">☁️</div>
    <div class="cloud cloud2">☁️</div>
    <div class="sun">☀️</div>

    <div class="login-wrapper">

        <!-- Left Side -->
        <div class="welcome-section">

            <div class="weather-icon">
                🌦️
            </div>

            <h1>MAUSAM</h1>

            <h2>Your Weather,<br>
                Your Way.</h2>

            <p>
                Get personalized weather updates,
                forecasts and smart recommendations
                based on your location.
            </p>

            <div class="weather-cards">

                <div class="mini-card">
                    <span>☀️</span>
                    <div>
                        <b>28°C</b>
                        <small>Sunny</small>
                    </div>
                </div>

                <div class="mini-card">
                    <span>🌧️</span>
                    <div>
                        <b>60%</b>
                        <small>Rain Chance</small>
                    </div>
                </div>

            </div>

        </div>


        <!-- Login Card -->
        <div class="login-card">

            <div class="mobile-logo">
                🌦️
            </div>

            <h2>Welcome Back!</h2>

            <p class="login-text">
                Login to your Mausam account
            </p>


            <form id="loginForm">

                <!-- Email -->
                <div class="input-box">

                    <span>📧</span>

                    <input
                        type="email"
                        id="email"
                        placeholder="Email Address"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="input-box">

                    <span>🔒</span>

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword()">
                        👁️
                    </button>

                </div>


                <div class="login-options">

                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="forgot-password.html">
                        Forgot Password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="login-btn">

                    Login ☁️

                </button>


                <p id="message"></p>

            </form>


            <div class="separator">
                <span>OR</span>
            </div>


            <button
                class="guest-btn"
                onclick="continueAsGuest()">

                Continue as Guest

            </button>


            <p class="signup-text">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>

        </div>

    </div>


    <script src="login.js"></script>

</body>
</html>
