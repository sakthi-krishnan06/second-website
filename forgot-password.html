<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mausam - Forgot Password</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/128/12607/12607703.png">

    <link rel="stylesheet"
          href="forgot-password.css">

</head>

<body>

    <!-- Weather Background -->

    <div class="cloud cloud-one">☁️</div>

    <div class="cloud cloud-two">☁️</div>

    <div class="sun">☀️</div>


    <div class="page-container">

        <div class="forgot-card">

            <!-- Logo -->

            <div class="logo">
                🌦️
            </div>

            <h1>Forgot Password?</h1>

            <p class="subtitle">
                Don't worry! We'll help you get back
                into your Mausam account.
            </p>


            <!-- Email Icon -->

            <div class="big-icon">
                🔐
            </div>


            <form id="forgotForm">

                <label for="email">
                    Enter your registered email
                </label>

                <div class="input-box">

                    <span>📧</span>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email address"
                        required
                    >

                </div>


                <button type="submit">
                    Send Reset Link
                </button>

            </form>


            <p id="message"></p>


            <div class="back-login">

                <a href="login.html">
                    ← Back to Login
                </a>

            </div>

        </div>

    </div>


    <script src="forgot-password.js"></script>

</body>

</html>
